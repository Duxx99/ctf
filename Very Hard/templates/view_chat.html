<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat Room</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: "Courier New", Courier, monospace;
            padding: 20px;
        }
        h1 {
            color: #ff2e2e;
            text-align: center;
        }
        form {
            text-align: center;
            margin-bottom: 20px;
        }
        textarea {
            width: 80%;
            height: 50px;
            margin-bottom: 10px;
            background-color: #1a1a1a;
            border: 1px solid #ff2e2e;
            color: #e0e0e0;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #ff2e2e;
            border: none;
            color: #0d0d0d;
            cursor: pointer;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 5px 0;
            padding: 10px;
            background-color: #1a1a1a;
            border-left: 4px solid #ff2e2e;
        }
        a {
            color: #ff2e2e;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>{{ chat.title }}</h1>
    <form action="/chat/{{ request.view_args['constructed_id'] }}" method="POST">
        <textarea name="content" placeholder="Enter your message"></textarea>
        <button type="submit">Send Message</button>
    </form>
    <h2>Messages</h2>
    <ul>
        {% for message in messages %}
            <li><strong>User {{ message.user_id }}:</strong> {{ message.content }}</li>
        {% endfor %}
    </ul>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
