<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: "Courier New", Courier, monospace;
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #ff2e2e;
            margin-bottom: 20px;
        }
        p {
            color: #999;
            font-style: italic;
        }
        input {
            margin: 10px;
            padding: 10px;
            border: 1px solid #ff2e2e;
            background-color: #1a1a1a;
            color: #e0e0e0;
        }
        button {
            padding: 10px 20px;
            background-color: #ff2e2e;
            border: none;
            color: #0d0d0d;
            cursor: pointer;
        }
        a {
            color: #ff2e2e;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Login</h1>
    <p>"You are not your job, you are not the contents of your wallet, you are not your khakis. You are not a beautiful and unique snowflake."</p>
    <form action="/login" method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <a href="/register">Not a member? Register here.</a>
</body>
</html>
